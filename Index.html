<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gömbi Boss Fight v7.3 - Mobile HUD</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0808;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: monospace;
            color: #fff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 0 40px rgba(0, 150, 255, 0.5);
            width: 100%;
            max-width: 800px;
            height: 100%;
            max-height: 450px;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border: 4px solid #1a242e;
            box-sizing: border-box;
            outline: none;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 14px;
            text-shadow: 2px 2px #000;
            pointer-events: none;
            width: calc(100% - 20px);
            display: flex;
            justify-content: space-between;
            z-index: 5;
        }
        .bar-container {
            width: 120px;
            height: 12px;
            background: #222;
            border: 2px solid #000;
            display: inline-block;
            vertical-align: middle;
            border-radius: 3px;
            overflow: hidden;
            position: relative;
        }
        #hpBar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #ff5555);
            float: left;
        }
        #shieldBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0088ff, #00d2ff);
            box-shadow: 0 0 8px #00aaff;
            float: left;
        }
        #bossUi {
            display: none;
            position: absolute;
            top: 45px;
            right: 10px;
            text-align: right;
            text-shadow: 2px 2px #000;
            z-index: 5;
            font-size: 14px;
        }
        #bossHpInner {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff1100, #ffaa00);
            box-shadow: 0 0 8px #ff3300;
        }
        
        /* FIX MOBIL HUD GOMBOK - KÖZVETLENÜL A JÁTÉKRA RÁHELYEZVE */
        .mobile-btn {
            position: absolute;
            width: 70px;
            height: 70px;
            background: rgba(26, 37, 46, 0.6);
            border: 3px solid rgba(0, 170, 255, 0.7);
            border-radius: 50%;
            color: #fff;
            font-size: 28px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .mobile-btn:active {
            background: rgba(0, 170, 255, 0.8);
            color: #000;
            box-shadow: 0 0 15px #00aaff;
        }
        
        /* Gombok elrendezése a sarkokban */
        #btnLeft { bottom: 20px; left: 20px; }
        #btnRight { bottom: 20px; left: 110px; }
        #btnJump { bottom: 105px; right: 30px; border-color: rgba(0, 255, 150, 0.7); }
        #btnJump:active { background: rgba(0, 255, 150, 0.8); }
        #btnShoot { bottom: 20px; right: 30px; border-color: rgba(255, 51, 0, 0.7); font-size: 20px; }
        #btnShoot:active { background: rgba(255, 51, 0, 0.8); color: #fff; }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450" tabindex="1"></canvas>
    <div id="ui">
        <div>
            ZÓNA: <span id="levelDisplay" style="color:#ffaa00; font-weight:bold;">1</span> / 5<br>
            VITALITY: 
            <div class="bar-container" style="width: 180px;">
                <div id="hpBar" style="width: 66%;"></div>
                <div id="shieldBar" style="width: 0%;"></div>
            </div>
        </div>
        <div id="weaponStatus" style="color: #ff3333; font-weight:bold; font-size:12px; text-align:right;">FEGYVERT REKVIZÁLNI!</div>
    </div>
    <div id="bossUi">
        <span style="color:#ff3300; font-weight:bold;">GÖMBI</span> (LVL <span id="bossLvlTxt">1</span>) <div class="bar-container"><div id="bossHpInner"></div></div>
    </div>

    <div class="mobile-btn" id="btnLeft">◀</div>
    <div class="mobile-btn" id="btnRight">▶</div>
    <div class="mobile-btn" id="btnJump">▲</div>
    <div class="mobile-btn" id="btnShoot">TŰZ</div>
</div>

<script>
window.onload = function() {
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    
    canvas.focus();

    let gameState = "START"; 
    let keys = {};
    let cameraX = 0;
    let cameraY = 350; 
    let worldWidth = 5000; 
    const worldHeight = 900; 
    let currentLevel = 1;

    let audioCtx = null;
    let audioLoopId = null;
    let audioStep = 0;

    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        startSynthMusic();
    }

    function startSynthMusic() {
        function playNote(time, freq, duration, type="sawtooth", vol=0.1) {
            if (!audioCtx || gameState === "GAMEOVER") return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, time);
                gain.gain.setValueAtTime(vol, time);
                gain.gain.exponentialRampToValueAtTime(0.0001, time + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(time);
                osc.stop(time + duration);
            } catch(e) {}
        }

        function musicLoop() {
            if (gameState === "PLAYING") {
                let now = audioCtx.currentTime;
                let tempo = 0.22 - (currentLevel * 0.018); 
                let notes = [82.41, 82.41, 110.00, 82.41, 98.00, 82.41, 73.42, 92.50];
                let currentNote = notes[audioStep % notes.length];
                
                if (audioStep % 4 === 0) {
                    playNote(now, currentNote, tempo * 0.9, "sawtooth", 0.12);
                    playNote(now, 55, tempo * 0.5, "triangle", 0.18);
                } else {
                    playNote(now, currentNote, tempo * 0.7, "square", 0.08);
                }
                audioStep++;
                audioLoopId = setTimeout(musicLoop, tempo * 1000);
            } else {
                audioLoopId = setTimeout(musicLoop, 300);
            }
        }
        musicLoop();
    }

    const player = {
        x: 100, y: 700, width: 32, height: 48,
        vx: 0, vy: 0, speed: 5, jumpForce: 13,
        grounded: false, 
        hp: 100, maxHp: 100,
        shield: 0, maxShield: 50,      
        noDamageTimer: 0,               
        hasWeapon: false, facingLeft: false,
        animTimer: 0
    };

    const weaponPickup = { x: 450, y: 730, width: 28, height: 16, collected: false };
    let platforms = [];
    let enemies = [];
    let bullets = [];
    let enemyBullets = [];
    let particles = [];

    const boss = {
        x: 4600, y: 300, radius: 55,
        width: 110, height: 110,     
        hp: 100, maxHp: 100, speed: 2, dir: -1, vy: 0,
        shootTimer: 0, meleeTimer: 0, active: false, pulse: 0
    };

    function generatePlatforms() {
        platforms = [];
        platforms.push({x: 0, y: 750, width: worldWidth, height: 150});

        if (currentLevel === 1) {
            platforms = [
                {x: 0, y: 750, width: 1200, height: 150},
                {x: 300, y: 650, width: 150, height: 20},
                {x: 600, y: 600, width: 200, height: 20},
                {x: 900, y: 670, width: 150, height: 20},
                {x: 1400, y: 750, width: 1500, height: 150},
                {x: 1600, y: 630, width: 180, height: 20},
                {x: 1900, y: 550, width: 200, height: 20},
                {x: 2300, y: 650, width: 250, height: 20},
                {x: 3100, y: 750, width: worldWidth - 3100, height: 150},
                {x: 3300, y: 630, width: 200, height: 20},
                {x: 3700, y: 570, width: 300, height: 20},
                {x: 4200, y: 650, width: 200, height: 20}
            ];
        } else {
            platforms = [
                {x: 0, y: 750, width: 1200, height: 150},
                {x: 1400, y: 750, width: 1500, height: 150},
                {x: 3100, y: 750, width: worldWidth - 3100, height: 150},
                {x: 300, y: 620, width: 200, height: 20},
                {x: 650, y: 530, width: 200, height: 20}
            ];
            for (let xPos = 1000; xPos < worldWidth - 1000; xPos += 420) {
                let heightY = 320 + Math.random() * 280;
                let widthW = 160 + Math.random() * 140;
                platforms.push({x: xPos, y: heightY, width: widthW, height: 22});
            }
        }
    }

    function initEnemiesForLevel() {
        enemies = [];
        if (currentLevel === 1) {
            enemies.push({type: "basic", x: 700, y: 710, width: 32, height: 32, hp: 1, speed: 2, dir: -1, patrolMin: 550, patrolMax: 900});
            enemies.push({type: "basic", x: 1100, y: 710, width: 32, height: 32, hp: 1, speed: 1.5, dir: 1, patrolMin: 900, patrolMax: 1150});
            enemies.push({type: "basic", x: 1600, y: 710, width: 32, height: 32, hp: 1, speed: 2, dir: -1, patrolMin: 1450, patrolMax: 1800});
            enemies.push({type: "basic", x: 2500, y: 710, width: 32, height: 32, hp: 1, speed: 2, dir: -1, patrolMin: 2300, patrolMax: 2800});
            enemies.push({type: "basic", x: 3400, y: 710, width: 32, height: 32, hp: 1, speed: 2.5, dir: -1, patrolMin: 3200, patrolMax: 3600});
        } else {
            let enemyCount = 6 + (currentLevel * 3);
            for (let i = 0; i < enemyCount; i++) {
                let spawnX = 600 + (i * (worldWidth - 1600) / enemyCount) + Math.random() * 120;
                let randType = Math.random();

                if (randType < 0.3) {
                    enemies.push({type: "basic", x: spawnX, y: 710, width: 32, height: 32, hp: Math.floor(1 + currentLevel*0.5), speed: 2 + (currentLevel * 0.2), dir: -1, patrolMin: spawnX - 160, patrolMax: spawnX + 160});
                } else if (randType < 0.55) {
                    enemies.push({type: "fly", x: spawnX, y: 200 + Math.random()*200, width: 30, height: 26, hp: 1, speed: 2 + currentLevel*0.3, dir: 1, startY: 250, timer: Math.random()*5});
                } else if (randType < 0.75) {
                    enemies.push({type: "jumper", x: spawnX, y: 500, width: 34, height: 34, hp: currentLevel, speed: 1.5 + currentLevel*0.2, dir: 1, patrolMin: spawnX - 120, patrolMax: spawnX + 120, vy: 0, jumpTimer: Math.random()*40});
                } else {
                    enemies.push({type: "cannon", x: spawnX, y: 600, width: 36, height: 42, hp: 2 + Math.floor(currentLevel/2), shootTimer: Math.random()*40});
                }
            }
            enemies.push({type: "miniboss", x: worldWidth / 2, y: 500, width: 55, height: 65, hp: 15 + currentLevel * 5, maxHp: 15 + currentLevel * 5, speed: 2, dir: -1, patrolMin: (worldWidth/2)-250, patrolMax: (worldWidth/2)+250, vy: 0, shootTimer: 0});
            if (currentLevel >= 4) {
                enemies.push({type: "miniboss", x: worldWidth - 1800, y: 500, width: 55, height: 65, hp: 25, maxHp: 25, speed: 2.5, dir: -1, patrolMin: worldWidth-2000, patrolMax: worldWidth-1500, vy: 0, shootTimer: 15});
            }
        }
    }

    function initBossForLevel() {
        boss.x = worldWidth - 450; 
        boss.y = 300; 
        boss.vy = 0;
        boss.shootTimer = 0; 
        boss.active = false;
        
        if (currentLevel === 5) {
            boss.maxHp = 450; 
            boss.speed = 4.0; 
        } else {
            boss.maxHp = 100 + (currentLevel - 1) * 65;
            boss.speed = 1.6 + currentLevel * 0.45; 
        }
        boss.hp = boss.maxHp;
        document.getElementById("bossLvlTxt").innerText = currentLevel;
    }

    function isVisibleOnScreen(x, width) {
        return x + width > cameraX && x < cameraX + canvas.width;
    }

    function damagePlayer(amount) {
        player.noDamageTimer = 0; 
        if (player.shield > 0) {
            player.shield -= amount;
            createParticles(player.x+16, player.y+24, "#00aaff", 6); 
            if (player.shield < 0) {
                player.hp += player.shield; 
                player.shield = 0;
            }
        } else {
            player.hp -= amount;
            createParticles(player.x+16, player.y+24, "#ff0055", 6); 
        }
    }

    function triggerMenuAction() {
        initAudio();
        if (gameState === "START" || gameState === "LEVEL_CLEAR" || gameState === "GAMEOVER" || gameState === "WIN") {
            if (gameState === "GAMEOVER" || gameState === "WIN") {
                currentLevel = 1; 
                player.hasWeapon = false;
            } else if (gameState === "LEVEL_CLEAR") {
                currentLevel++;
            }
            keys = {}; 
            gameState = "PLAYING";
            resetLevel();
        }
    }

    // Mobil és asztali indítás
    canvas.addEventListener("click", () => {
        if (gameState !== "PLAYING") triggerMenuAction();
    });

    canvas.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
            triggerMenuAction();
            e.preventDefault();
            return;
        }
        keys[e.key.toLowerCase()] = true;
        if (e.key === " ") keys["space"] = true;
        if (e.key.toLowerCase() === "f" && gameState === "PLAYING" && player.hasWeapon) {
            shootBullet();
        }
    });

    canvas.addEventListener("keyup", (e) => { 
        keys[e.key.toLowerCase()] = false; 
        if (e.key === " ") keys["space"] = false;
    });

    // ÉRINTŐGOMBOK BEÁLLÍTÁSA
    setupMobileButton("btnLeft", "a");
    setupMobileButton("btnRight", "d");
    setupMobileButton("btnJump", "space");

    function setupMobileButton(btnId, keyName) {
        const btn = document.getElementById(btnId);
        btn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            if (gameState !== "PLAYING") {
                triggerMenuAction();
                return;
            }
            keys[keyName] = true;
        });
        btn.addEventListener("touchend", (e) => {
            e.preventDefault();
            keys[keyName] = false;
        });
    }

    document.getElementById("btnShoot").addEventListener("touchstart", (e) => {
        e.preventDefault();
        if (gameState !== "PLAYING") {
            triggerMenuAction();
            return;
        }
        if (player.hasWeapon) shootBullet();
    });

    function resetLevel() {
        worldWidth = 5000 + (currentLevel - 1) * 1000;
        player.x = 100; player.y = 700; player.vx = 0; player.vy = 0; 
        player.hp = 100; player.shield = 0; player.noDamageTimer = 0;
        player.facingLeft = false; player.grounded = false;
        cameraX = 0;
        cameraY = (currentLevel === 1) ? 350 : 450; 

        if (currentLevel === 1 && !player.hasWeapon) { weaponPickup.collected = false; } 
        else { weaponPickup.collected = true; }
        
        bullets = []; enemyBullets = []; particles = [];
        generatePlatforms();
        initEnemiesForLevel();
        initBossForLevel();
        
        document.getElementById("levelDisplay").innerText = currentLevel;
        document.getElementById("bossUi").style.display = "none";
        updateUiBars();
    }

    function handlePlayerDeath() {
        player.vx = 0; player.vy = 0; player.hp = 0; player.shield = 0;
        updateUiBars();
        gameState = "GAMEOVER"; 
    }

    function shootBullet() {
        bullets.push({
            x: player.facingLeft ? player.x - 12 : player.x + player.width + 4,
            y: player.y + 20, vx: player.facingLeft ? -13 : 13, vy: 0, width: 12, height: 4
        });
    }

    function spawnEnemyBullet(x, y, vx, vy) {
        enemyBullets.push({ x, y, vx, vy, width: 8, height: 8 });
    }

    function createParticles(x, y, color, count=8) {
        for(let i=0; i<count; i++) {
            particles.push({
                x, y, vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
                radius: Math.random() * 3 + 2, alpha: 1, color: color
            });
        }
    }

    function checkCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width && rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height && rect1.y + rect1.height > rect2.y;
    }

    function updateUiBars() {
        let totalMax = player.maxHp + player.maxShield;
        let hpPct = (player.hp / totalMax) * 100;
        let shieldPct = (player.shield / totalMax) * 100;
        
        document.getElementById("hpBar").style.width = hpPct + "%";
        document.getElementById("shieldBar").style.width = shieldPct + "%";
    }

    function update() {
        if (gameState === "PLAYING") {
            player.animTimer += 0.15;
            
            if (player.hasWeapon) {
                player.noDamageTimer++;
                if (player.noDamageTimer >= 180 && player.shield < player.maxShield) {
                    player.shield += 0.2; 
                    if (player.shield > player.maxShield) player.shield = player.maxShield;
                }
            }

            if (keys["a"] || keys["arrowleft"]) { player.vx = -player.speed; player.facingLeft = true; }
            else if (keys["d"] || keys["arrowright"]) { player.vx = player.speed; player.facingLeft = false; }
            else { player.vx = 0; }

            if ((keys["w"] || keys["arrowup"] || keys["space"]) && player.grounded) {
                player.vy = -player.jumpForce;
                player.grounded = false;
            }

            player.vy += 0.5; player.x += player.vx; player.y += player.vy;
            
            if (player.x < 0) player.x = 0;
            if (player.x > worldWidth - player.width) player.x = worldWidth - player.width;

            player.grounded = false;
            platforms.forEach(p => {
                if (player.x + player.width > p.x && player.x < p.x + p.width) {
                    if (player.y + player.height >= p.y && player.y + player.height - player.vy <= p.y) {
                        player.y = p.y - player.height; player.vy = 0; player.grounded = true;
                    }
                }
            });

            if (player.y > worldHeight) { handlePlayerDeath(); }

            updateUiBars();

            if (player.hasWeapon) {
                if (player.shield > 0) {
                    document.getElementById("weaponStatus").innerText = "PAJZS FELTÖLTVE!";
                    document.getElementById("weaponStatus").style.color = "#00d2ff";
                } else {
                    document.getElementById("weaponStatus").innerText = "LÉZER AKTÍV!";
                    document.getElementById("weaponStatus").style.color = "#00ffcc";
                }
            }

            if (player.hp <= 0) { handlePlayerDeath(); }

            if (!weaponPickup.collected && checkCollision(player, weaponPickup)) {
                weaponPickup.collected = true; player.hasWeapon = true;
                createParticles(weaponPickup.x, weaponPickup.y, "#00ffcc", 20);
            }

            cameraX = player.x - canvas.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > worldWidth - canvas.width) cameraX = worldWidth - canvas.width;

            if (currentLevel === 1) {
                cameraY = 350; 
            } else {
                cameraY = player.y - canvas.height / 2 - 50;
                if (cameraY < 0) cameraY = 0;
                if (cameraY > worldHeight - canvas.height) cameraY = worldHeight - canvas.height;
            }

            for (let bIdx = bullets.length - 1; bIdx >= 0; bIdx--) {
                let b = bullets[bIdx]; b.x += b.vx;
                let bRemoved = false;

                for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                    let e = enemies[eIdx];
                    if (checkCollision(b, e)) {
                        e.hp -= 1;
                        createParticles(b.x, b.y, "#00ffcc", 6);
                        bullets.splice(bIdx, 1); bRemoved = true;

                        if (e.hp <= 0) {
                            createParticles(e.x + e.width/2, e.y + e.height/2, "#ffaa00", 15);
                            enemies.splice(eIdx, 1);
                        }
                        break;
                    }
                }
                if (bRemoved) continue;

                if (boss.hp > 0 && boss.active && checkCollision(b, boss)) {
                    boss.hp -= 1;
                    createParticles(b.x, b.y, "#ff3300", 5); bullets.splice(bIdx, 1);
                    document.getElementById("bossHpInner").style.width = (boss.hp / boss.maxHp * 100) + "%";
                    
                    if (boss.hp <= 0) {
                        createParticles(boss.x + boss.width/2, boss.y + boss.height/2, "#ff0055", 60);
                        gameState = (currentLevel < 5) ? "LEVEL_CLEAR" : "WIN";
                    }
                }
                if(b.x < cameraX || b.x > cameraX + canvas.width) bullets.splice(bIdx, 1);
            }

            for (let eIdx = enemies.length - 1; eIdx >= 0; eIdx--) {
                let e = enemies[eIdx];

                if (e.type === "basic") {
                    e.x += e.speed * e.dir;
                    if (e.x < e.patrolMin) { e.x = e.patrolMin; e.dir = 1; }
                    if (e.x > e.patrolMax) { e.x = e.patrolMax; e.dir = -1; }
                    if (isVisibleOnScreen(e.x, e.width) && Math.random() < 0.006) {
                        spawnEnemyBullet(e.x+10, e.y+14, e.dir * 4.5, 0);
                    }
                }
                else if (e.type === "fly") {
                    e.timer += 0.05; e.x += e.speed * e.dir;
                    e.y = e.startY + Math.sin(e.timer) * 35;
                    if (e.x < 100 || e.x > worldWidth - 200) e.dir *= -1;
                    if (Math.abs(player.x - e.x) < 400 && Math.random() < 0.009) {
                        let dx = player.x - e.x; let dy = player.y - e.y;
                        let angle = Math.atan2(dy, dx);
                        spawnEnemyBullet(e.x+10, e.y+10, Math.cos(angle)*4.5, Math.sin(angle)*4.5);
                    }
                }
                else if (e.type === "jumper") {
                    e.x += e.speed * e.dir;
                    if (e.x < e.patrolMin) { e.x = e.patrolMin; e.dir = 1; }
                    if (e.x > e.patrolMax) { e.x = e.patrolMax; e.dir = -1; }
                    
                    e.vy += 0.4; e.y += e.vy;
                    platforms.forEach(p => {
                        if (e.x + e.width > p.x && e.x < p.x + p.width) {
                            if (e.y + e.height >= p.y && e.y + e.height - e.vy <= p.y) {
                                e.y = p.y - e.height; e.vy = 0;
                            }
                        }
                    });
                    e.jumpTimer++;
                    if (e.jumpTimer > 85 && isVisibleOnScreen(e.x, e.width)) {
                        e.vy = -9.5; e.jumpTimer = 0;
                    }
                }
                else if (e.type === "cannon") {
                    e.shootTimer++;
                    if (e.shootTimer > 75 && isVisibleOnScreen(e.x, e.width)) {
                        e.shootTimer = 0;
                        let d = (player.x < e.x) ? -1 : 1;
                        spawnEnemyBullet(e.x + 15, e.y + 10, d * 5.5, -1.5);
                        spawnEnemyBullet(e.x + 15, e.y + 10, d * 4.5, 0);
                    }
                }
                else if (e.type === "miniboss") {
                    e.x += e.speed * e.dir;
                    if (e.x < e.patrolMin) { e.x = e.patrolMin; e.dir = 1; }
                    if (e.x > e.patrolMax) { e.x = e.patrolMax; e.dir = -1; }
                    e.shootTimer++;
                    if(e.shootTimer > 45 && isVisibleOnScreen(e.x, e.width)) {
                        e.shootTimer = 0;
                        spawnEnemyBullet(e.x+25, e.y+20, -5, 0);
                        spawnEnemyBullet(e.x+25, e.y+20, 5, 0);
                    }
                }

                if (checkCollision(player, e)) {
                    if (player.vy > 0 && (player.y + player.height - player.vy) <= e.y + 12) {
                        e.hp -= 2;
                        createParticles(e.x + e.width/2, e.y + e.height/2, "#ffcc00", 12);
                        player.vy = -8.5;
                        if (e.hp <= 0) enemies.splice(eIdx, 1);
                    } else {
                        damagePlayer((e.type === "miniboss") ? 1.8 : 0.9); 
                    }
                }
            }

            if (player.x > worldWidth - 1300) {
                boss.active = true;
                boss.pulse += 0.07;
                document.getElementById("bossUi").style.display = "block";

                boss.vy += 0.5;
                boss.y += boss.vy;

                platforms.forEach(p => {
                    if (boss.x + boss.width > p.x && boss.x < p.x + p.width) {
                        if (boss.y + boss.height >= p.y && boss.y + boss.height - boss.vy <= p.y) {
                            boss.y = p.y - boss.height;
                            boss.vy = 0;
                        }
                    }
                });

                if (boss.x > player.x + 40) { boss.x -= boss.speed; boss.dir = -1; }
                else if (boss.x < player.x - 40) { boss.x += boss.speed; boss.dir = 1; }

                if (isVisibleOnScreen(boss.x, boss.width)) {
                    boss.shootTimer++;
                    let fireRate = Math.max(35, 90 - (currentLevel * 12));
                    if (boss.shootTimer > fireRate) {
                        boss.shootTimer = 0;
                        let bSpd = 4.5 + (currentLevel * 0.4);
                        spawnEnemyBullet(boss.x + boss.width/2, boss.y + boss.height/2, boss.dir * bSpd, -2);
                        spawnEnemyBullet(boss.x + boss.width/2, boss.y + boss.height/2, boss.dir * bSpd, 0);
                        spawnEnemyBullet(boss.x + boss.width/2, boss.y + boss.height/2, boss.dir * bSpd, 2);
                    }
                }

                if (checkCollision(player, boss)) {
                    boss.meleeTimer++;
                    if(boss.meleeTimer % 8 === 0) {
                        damagePlayer(22);
                    }
                }
            }

            for (let ebIdx = enemyBullets.length - 1; ebIdx >= 0; ebIdx--) {
                let eb = enemyBullets[ebIdx]; eb.x += eb.vx; eb.y += eb.vy;
                if (checkCollision(eb, player)) {
                    damagePlayer(8);
                    enemyBullets.splice(ebIdx, 1); continue;
                }
                if(eb.x < cameraX - 50 || eb.x > cameraX + canvas.width + 50 || eb.y < 0 || eb.y > worldHeight) {
                    enemyBullets.splice(ebIdx, 1);
                }
            }
        }

        for (let idx = particles.length - 1; idx >= 0; idx--) {
            let p = particles[idx]; p.x += p.vx; p.y += p.vy; p.alpha -= 0.02;
            if (p.alpha <= 0) particles.splice(idx, 1);
        }

        render();
        requestAnimationFrame(update);
    }

    function drawMenuOverlay(title, subtitle, actionText, titleColor = "#00d2ff") {
        ctx.fillStyle = "rgba(4, 6, 10, 0.96)";
        ctx.fillRect(cameraX, cameraY, canvas.width, canvas.height);
        ctx.strokeStyle = titleColor;
        ctx.lineWidth = 4;
        ctx.strokeRect(cameraX + 50, cameraY + 40, canvas.width - 100, canvas.height - 80);
        ctx.fillStyle = titleColor;
        ctx.font = "bold 24px monospace";
        ctx.textAlign = "center";
        ctx.fillText(title, cameraX + canvas.width / 2, cameraY + 130);
        ctx.fillStyle = "#aaa";
        ctx.font = "14px monospace";
        ctx.fillText(subtitle, cameraX + canvas.width / 2, cameraY + 200);
        ctx.fillStyle = "#00ffcc";
        ctx.font = "bold 16px monospace";
        
        ctx.fillText("BÖKJ RÁ A KÉPERNYŐRE A TOVÁBBLÉPÉSHEZ", cameraX + canvas.width / 2, cameraY + 310);
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(-cameraX, -cameraY);

        let bgColors = ["#080f14", "#0b0814", "#060b12", "#07120a", "#140606"];
        ctx.fillStyle = bgColors[(currentLevel-1) % 5];
        ctx.fillRect(cameraX, cameraY, canvas.width, canvas.height);

        ctx.fillStyle = "#10181f";
        for(let i=0; i<worldWidth; i+=300) {
            ctx.fillRect(i, 380, 130, 550);
            ctx.fillStyle = "#0a0f14";
            for(let wY=400; wY<700; wY+=40) {
                ctx.fillRect(i+20, wY, 15, 20);
                ctx.fillRect(i+60, wY, 15, 20);
            }
            ctx.fillStyle = "#10181f";
        }

        platforms.forEach(p => {
            ctx.fillStyle = "#1a252e"; ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = "#00bbff"; ctx.fillRect(p.x, p.y, p.width, 3);       
            ctx.fillStyle = "#121a21"; ctx.fillRect(p.x, p.y+3, p.width, 4);     
        });

        if (!weaponPickup.collected) {
            ctx.fillStyle = "#00ffcc"; ctx.fillRect(weaponPickup.x, weaponPickup.y, weaponPickup.width, weaponPickup.height);
            ctx.fillStyle = "#111"; ctx.fillRect(weaponPickup.x+2, weaponPickup.y+2, 12, 6);
            ctx.fillStyle = "#ff0055"; ctx.fillRect(weaponPickup.x+18, weaponPickup.y+4, 6, 4);
        }

        if (player.shield > 0) {
            ctx.strokeStyle = "rgba(0, 170, 255, " + (0.4 + Math.sin(player.animTimer)*0.2) + ")";
            ctx.lineWidth = 4;
            ctx.strokeRect(player.x - 3, player.y - 14, player.width + 6, player.height + 16);
        }

        let walkCycle = Math.sin(player.animTimer) * 4;
        ctx.fillStyle = "#2a3d30"; 
        ctx.fillRect(player.x, player.y, player.width, player.height - 6);
        ctx.fillStyle = "#1e2b22"; 
        ctx.fillRect(player.x+4, player.y+6, 12, 14);
        ctx.fillRect(player.x+16, player.y+18, 10, 12);
        
        ctx.fillStyle = "#555"; 
        ctx.fillRect(player.x - 2, player.y + 4, 6, 8);
        ctx.fillRect(player.x + player.width - 4, player.y + 4, 6, 8);
        
        ctx.fillStyle = "#111"; 
        if (player.vx !== 0) {
            ctx.fillRect(player.x+2, player.y + player.height - 6 + walkCycle, 10, 6);
            ctx.fillRect(player.x+18, player.y + player.height - 6 - walkCycle, 10, 6);
        } else {
            ctx.fillRect(player.x+2, player.y + player.height - 6, 10, 6);
            ctx.fillRect(player.x+18, player.y + player.height - 6, 10, 6);
        }

        ctx.fillStyle = "#3d474d"; ctx.fillRect(player.x + 6, player.y - 12, 20, 12);
        ctx.fillStyle = player.shield > 0 ? "#00d2ff" : "#ff0055"; 
        if (player.facingLeft) { ctx.fillRect(player.x + 4, player.y - 8, 10, 4); } 
        else { ctx.fillRect(player.x + 18, player.y - 8, 10, 4); }
        
        if (player.hasWeapon) {
            ctx.fillStyle = "#333";
            let gunY = player.y + 16;
            if (player.facingLeft) {
                ctx.fillRect(player.x - 16, gunY, 18, 8);
                ctx.fillStyle = "#00ffcc"; ctx.fillRect(player.x - 16, gunY+2, 6, 2);
            } else {
                ctx.fillRect(player.x + player.width - 2, gunY, 18, 8);
                ctx.fillStyle = "#00ffcc"; ctx.fillRect(player.x + player.width + 10, gunY+2, 6, 2);
            }
        }

        enemies.forEach(e => {
            let pulse = Math.sin(player.animTimer + e.x) * 2;
            if (e.type === "basic") {
                ctx.fillStyle = "#a85200"; ctx.fillRect(e.x, e.y, e.width, e.height);
                ctx.fillStyle = "#d46a00"; ctx.fillRect(e.x+2, e.y+2, e.width-4, e.height-4);
                ctx.fillStyle = "#ffff00"; ctx.fillRect(e.x + (e.dir === -1 ? 4 : 22), e.y + 6, 6, 6);
            } 
            else if (e.type === "fly") {
                ctx.fillStyle = "#69009c"; ctx.fillRect(e.x, e.y, e.width, e.height);
                ctx.fillStyle = "#aa00ff";
                ctx.fillRect(e.x - 6, e.y + 2 + pulse, 6, 12); 
                ctx.fillRect(e.x + e.width, e.y + 2 + pulse, 6, 12);
                ctx.fillStyle = "#ff0055"; ctx.fillRect(e.x + 12, e.y + 6, 8, 4);
            } 
            else if (e.type === "jumper") {
                ctx.fillStyle = "#007326"; ctx.fillRect(e.x, e.y+pulse, e.width, e.height-pulse);
                ctx.fillStyle = "#00cc44"; ctx.fillRect(e.x+4, e.y+4+pulse, e.width-8, 6);
                ctx.fillStyle = "#ccff33"; ctx.fillRect(e.x+6, e.y+12, 6, 6); ctx.fillRect(e.x+20, e.y+12, 6, 6);
            } 
            else if (e.type === "cannon") {
                ctx.fillStyle = "#444"; ctx.fillRect(e.x, e.y, e.width, e.height);
                ctx.fillStyle = "#222"; ctx.fillRect(e.x + 4, e.y - 6, 28, 16);
                ctx.fillStyle = "#ff3300"; ctx.fillRect(e.x + 12, e.y + 14, 12, 12);
            } 
            else if (e.type === "miniboss") {
                ctx.fillStyle = "#990000"; ctx.fillRect(e.x, e.y, e.width, e.height);
                ctx.fillStyle = "#ff2200"; ctx.fillRect(e.x+4, e.y+4, e.width-8, e.height-8);
                ctx.fillStyle = "#fff"; ctx.fillRect(e.x+14, e.y+14, 8, 8); ctx.fillRect(e.x+32, e.y+14, 8, 8);
                ctx.fillStyle = "#222"; ctx.fillRect(e.x, e.y - 10, e.width, 5);
                ctx.fillStyle = "#ff3300"; ctx.fillRect(e.x, e.y - 10, (e.hp / e.maxHp) * e.width, 5);
            }
        });

        if (boss.hp > 0 && player.x > worldWidth - 1600) {
            let pulseRadius = boss.radius + Math.sin(boss.pulse) * 4;
            let centerX = boss.x + boss.radius;
            let centerY = boss.y + boss.radius;

            ctx.fillStyle = "#5c0000";
            ctx.beginPath(); ctx.arc(centerX, centerY, pulseRadius, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#b30014";
            ctx.beginPath(); ctx.arc(centerX, centerY, pulseRadius - 8, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#88cc00";
            ctx.beginPath(); ctx.arc(centerX - 20, centerY - 20, 10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(centerX + 25, centerY - 15, 12, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(centerX + 15, centerY + 25, 9, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = "#ffff00";
            let eyeOffsetX = boss.dir === -1 ? -18 : 6;
            ctx.fillRect(centerX + eyeOffsetX, centerY - 10, 16, 16);
            ctx.fillStyle = "#ff0000"; 
            ctx.fillRect(centerX + eyeOffsetX + (boss.dir === -1 ? 2 : 8), centerY - 6, 6, 6);
        }

        ctx.fillStyle = "#00ffcc"; bullets.forEach(b => { ctx.fillRect(b.x, b.y, b.width, b.height); });
        ctx.fillStyle = "#ff3300"; enemyBullets.forEach(eb => { ctx.beginPath(); ctx.arc(eb.x+4, eb.y+4, 5, 0, Math.PI*2); ctx.fill(); });
        
        particles.forEach(p => {
            ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1;
        });

        if (gameState === "START") {
            drawMenuOverlay("GÖMBI BOSS FIGHT v7.3", "Menetelj végig a fertőzött zónákon és győzd le GÖMBIT!", "", "#ff3300");
        } else if (gameState === "GAMEOVER") {
            drawMenuOverlay("JÁTÉK VÉGE!", "Gömbi és hordája letarolt téged.", "", "#ff0055");
        } else if (gameState === "LEVEL_CLEAR") {
            drawMenuOverlay("ZÓNA MEGTISZTÍTVA!", "Gömbi egy megtestesülése elpusztult, de a mutáció terjed tovább.", "", "#00ffcc");
        } else if (gameState === "WIN") {
            drawMenuOverlay("A VÉGSŐ GYŐZELEM!", "Sikeresen megsemmisítetted a legfőbb GÖMBIT! Megmentetted a világot.", "", "#ffff00");
        }

        ctx.restore();
    }

    resetLevel();
    update();
};
</script>
